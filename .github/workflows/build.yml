name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            libffi-dev \
            libssl-dev \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            m4 \
            gettext \
            autopoint \
            openjdk-17-jdk \
            zip \
            unzip \
            zlib1g-dev

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0.0" "buildozer==1.5.0"

      - name: Build APK with Clean Environment
        run: |
          # حظر متغيرات سيرفر جيتهاب لتنفيذ NDK 25b بأسلوب صحيح
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          unset ANDROID_NDK
          buildozer -s android debug
        env:
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""
          ANDROID_NDK: ""

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rp2350-touch-app
          path: bin/*.apk
