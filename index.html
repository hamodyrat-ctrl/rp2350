<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RP2350 CyberDeck Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0e15;
      color: #00e5ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* الشريط العلوي */
    #top-bar {
      height: 55px;
      background: #141522;
      border-bottom: 2px solid #00e5ff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      z-index: 1000;
    }

    #status {
      font-size: 13px;
      font-weight: bold;
      color: #ff5252;
    }

    .btn-conn {
      background: #00e5ff;
      color: #000;
      border: none;
      padding: 8px 12px;
      font-weight: bold;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
      margin-left: 5px;
    }

    /* شاشة الرسم الخاصة بالواجهة */
    #canvas {
      position: relative;
      flex: 1;
      width: 100%;
      height: calc(100vh - 55px);
      background: #08090d;
    }

    /* العناصر المرسومة */
    .cyber-btn {
      position: absolute;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: transform 0.1s;
    }

    .cyber-btn:active {
      transform: scale(0.95);
    }

    .cyber-txt {
      position: absolute;
      font-weight: bold;
      white-space: nowrap;
      user-select: none;
    }

    .cyber-rect {
      position: absolute;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <div id="status">🔴 غير متصل</div>
    <div>
      <button class="btn-conn" onclick="connectMobileOTG()">📱 توصيل الموبايل (OTG)</button>
      <button class="btn-conn" style="background:#7c4dff; color:#fff;" onclick="connectPC()">💻 كمبيوتر</button>
    </div>
  </div>

  <div id="canvas"></div>

  <script>
    let mode = ""; // "webusb" or "webserial"
    let portWriter, usbDevice, inEndpoint = 1, outEndpoint = 2, dataInterfaceNum = 1;

    // -------------------------------------------------------------
    // 1. الاتصال المخصص للموبايل عبر OTG (WebUSB)
    // -------------------------------------------------------------
    async function connectMobileOTG() {
      try {
        // طلب جهاز الـ USB الموصول بالكابل
        usbDevice = await navigator.usb.requestDevice({
          filters: [{ vendorId: 0x2e8a }] // Raspberry Pi RP2350 / RP2040
        });

        await usbDevice.open();
        if (usbDevice.configuration === null) {
          await usbDevice.selectConfiguration(1);
        }

        // تحديد واجهة البيانات (CDC Data Interface)
        let dataInterface = usbDevice.configuration.interfaces.find(iface => 
          iface.alternates.some(alt => alt.interfaceClass === 0x0a || alt.interfaceClass === 0x02)
        ) || usbDevice.configuration.interfaces[1];

        dataInterfaceNum = dataInterface.interfaceNumber;
        await usbDevice.claimInterface(dataInterfaceNum);

        // تفعيل خط الداتا DTR
        try {
          await usbDevice.controlTransferOut({
            requestType: 'class',
            recipient: 'interface',
            request: 0x22, // SET_CONTROL_LINE_STATE
            value: 0x01,   // DTR High
            index: 0
          });
        } catch(e){}

        // تحديد نقاط الإرسال والاستقبال
        let alt = dataInterface.alternates[0];
        for (let ep of alt.endpoints) {
          if (ep.direction === 'in') inEndpoint = ep.endpointNumber;
          if (ep.direction === 'out') outEndpoint = ep.endpointNumber;
        }

        mode = "webusb";
        updateStatus("🟢 متصل عبر OTG (الموبايل)", "#00e5ff");

        // طلب الواجهة من RP2350
        await sendCommand("REQ_UI");
        readUsbLoop();

      } catch (e) {
        alert("خطأ في اتصال الموبايل: " + e.message);
      }
    }

    async function readUsbLoop() {
      let decoder = new TextDecoder();
      let buffer = "";
      while (usbDevice && usbDevice.opened) {
        try {
          let result = await usbDevice.transferIn(inEndpoint, 64);
          if (result.data && result.data.byteLength > 0) {
            buffer += decoder.decode(result.data);
            let lines = buffer.split("\n");
            buffer = lines.pop();
            for (let line of lines) {
              if (line.trim()) parseCommand(line.trim());
            }
          }
        } catch (e) {
          break;
        }
      }
    }

    // -------------------------------------------------------------
    // 2. الاتصال المخصص للكمبيوتر (WebSerial)
    // -------------------------------------------------------------
    async function connectPC() {
      try {
        let serialPort = await navigator.serial.requestPort();
        await serialPort.open({ baudRate: 115200 });

        const textEncoder = new TextEncoderStream();
        textEncoder.readable.pipeTo(serialPort.writable);
        portWriter = textEncoder.writable.getWriter();

        mode = "webserial";
        updateStatus("🟢 متصل عبر السيريال (الكمبيوتر)", "#7c4dff");

        await sendCommand("REQ_UI");

        // حلقة القراءة للكمبيوتر
        const textDecoder = new TextDecoderStream();
        serialPort.readable.pipeTo(textDecoder.writable);
        const reader = textDecoder.readable.getReader();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += value;
          let lines = buffer.split("\n");
          buffer = lines.pop();
          for (let line of lines) {
            if (line.trim()) parseCommand(line.trim());
          }
        }
      } catch (e) {
        alert("خطأ في اتصال الكمبيوتر: " + e.message);
      }
    }

    // -------------------------------------------------------------
    // 3. إرسال الأوامر الموحد
    // -------------------------------------------------------------
    async function sendCommand(data) {
      if (mode === "webusb" && usbDevice) {
        let encoder = new TextEncoder();
        await usbDevice.transferOut(outEndpoint, encoder.encode(data + "\n"));
      } else if (mode === "webserial" && portWriter) {
        await portWriter.write(data + "\n");
      }
    }

    function updateStatus(txt, col) {
      const st = document.getElementById("status");
      st.innerText = txt;
      st.style.color = col;
    }

    // -------------------------------------------------------------
    // 4. معالج رسم الأوامر القادمة من RP2350
    // -------------------------------------------------------------
    function parseCommand(cmd) {
      const parts = cmd.split(",");
      const action = parts[0];
      const canvas = document.getElementById("canvas");

      if (action === "CLEAR") {
        canvas.innerHTML = "";
      } 
      else if (action === "BTN" && parts.length >= 7) {
        let [_, id, text, x, y, w, h, r=0, g=150, b=255] = parts;
        let btn = document.createElement("button");
        btn.className = "cyber-btn";
        btn.innerText = text;
        btn.style.left = x + "px"; 
        btn.style.top = y + "px";
        btn.style.width = w + "px"; 
        btn.style.height = h + "px";
        btn.style.backgroundColor = `rgb(${r},${g},${b})`;
        btn.onclick = () => sendCommand(`CLICK:${id}`);
        canvas.appendChild(btn);
      } 
      else if (action === "TXT" && parts.length >= 6) {
        let [_, id, text, x, y, size, r=255, g=255, b=255] = parts;
        let txt = document.createElement("div");
        txt.className = "cyber-txt";
        txt.innerText = text;
        txt.style.left = x + "px"; 
        txt.style.top = y + "px";
        txt.style.fontSize = size + "px";
        txt.style.color = `rgb(${r},${g},${b})`;
        canvas.appendChild(txt);
      } 
      else if (action === "RECT" && parts.length >= 6) {
        let [_, id, x, y, w, h, r=30, g=35, b=50] = parts;
        let rect = document.createElement("div");
        rect.className = "cyber-rect";
        rect.style.left = x + "px"; 
        rect.style.top = y + "px";
        rect.style.width = w + "px"; 
        rect.style.height = h + "px";
        rect.style.backgroundColor = `rgb(${r},${g},${b})`;
        canvas.appendChild(rect);
      }
    }
  </script>
</body>
</html>
